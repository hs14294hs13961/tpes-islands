<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B5B95">
  <meta name="description" content="新竹縣關西鎮太平國小的學習成果群島：每一屆一座島，點進去看孩子們的作品。">
  <title>太平群島</title>
  <meta property="og:title" content="太平群島｜太平國小學習成果">
  <meta property="og:description" content="每一屆一座島，點進去看孩子們的作品。">
  <meta property="og:type" content="website">
  <link rel="icon" href="./public/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="./public/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="loading" class="loading">
    <img src="./public/qchick/wave.png" alt="" aria-hidden="true">
    <p>太平群島正在浮出海面…</p>
  </div>
  <script>
    // 3D 載不起來（裝置太舊不支援、網路中斷）時，別讓人一直看著「正在浮出海面」
    (function () {
      function fail() {
        var box = document.getElementById('loading');
        if (!box || box.classList.contains('done') || box.dataset.failed) return;
        box.dataset.failed = '1';
        box.querySelector('p').textContent = '島嶼沒有順利浮上來。請檢查網路後重新整理；如果還是不行，可能是這台裝置的瀏覽器太舊。';
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'q-opt primary';
        b.textContent = '重新整理';
        b.onclick = function () { location.reload(); };
        box.appendChild(b);
      }
      addEventListener('error', function (e) { if (!e.target || e.target === window || e.target.tagName === 'SCRIPT') fail(); }, true);
      addEventListener('unhandledrejection', fail);
      setTimeout(fail, 30000);
    })();
  </script>

  <header class="top">
    <div class="card brand">
      <img class="brand-mark" src="./public/logo.png" alt="太平國小校徽">
      <div>
        <h1>太平群島</h1>
        <p class="brand-sub"><span class="live-dot"></span><span id="brand-sub">讀取中</span></p>
      </div>
    </div>
    <div class="card stats" id="stats" aria-label="群島統計"></div>
    <nav class="card actions" aria-label="主要功能">
      <button type="button" class="ghost" id="btn-home">全景</button>
      <a class="cta" id="upload-link" href="#" target="_blank" rel="noopener">上傳成果 ↗</a>
    </nav>
  </header>

  <aside class="card info-card" id="info-card" aria-live="polite">
    <button type="button" class="close" id="info-close" aria-label="關閉">×</button>
    <p class="info-q" id="info-q" hidden><img id="info-q-face" alt="" aria-hidden="true"><span id="info-q-text"></span></p>
    <p class="info-island" id="info-island"></p>
    <h2 id="info-title"></h2>
    <p class="info-meta" id="info-meta"></p>
    <p class="info-desc" id="info-desc"></p>
    <button type="button" class="info-link" id="info-link" hidden></button>
    <div class="read-panel" id="read-panel" hidden></div>
    <div class="rec-list" id="info-records"></div>
    <a class="rec-more" id="info-more" target="_blank" rel="noopener">到電子書櫃看全部 ↗</a>
  </aside>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
    <div class="card viewer-box">
      <header class="viewer-head">
        <div>
          <p class="viewer-meta" id="viewer-meta"></p>
          <h3 id="viewer-title"></h3>
        </div>
        <a class="viewer-open" id="viewer-open" target="_blank" rel="noopener">另開 ↗</a>
        <button type="button" class="close" id="viewer-close" aria-label="關閉預覽">×</button>
      </header>
      <p class="viewer-desc" id="viewer-desc"></p>
      <div class="viewer-body" id="viewer-body"></div>
      <section class="talk" id="talk" hidden>
        <button type="button" class="talk-toggle" id="talk-toggle" aria-expanded="false" aria-controls="talk-panel"><span class="talk-icon" aria-hidden="true">💬</span><span class="talk-label">留言鼓勵孩子<span id="talk-count"></span></span><span class="talk-hint">點這裡寫一句話</span></button>
        <div class="talk-panel" id="talk-panel" hidden>
          <ul class="talk-list" id="talk-list" hidden></ul>
          <div id="talk-compose"></div>
          <div class="talk-foot">
            <p class="talk-note" id="talk-note" aria-live="polite"></p>
            <button type="button" class="q-opt primary" id="talk-send" disabled>送出留言</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="egg-modal" id="egg-modal" hidden>
    <div class="card egg-card" role="dialog" aria-modal="true" aria-label="太平小彩蛋">
      <button type="button" class="close" id="egg-close" aria-label="關閉">×</button>
      <div id="egg-content"></div>
    </div>
  </div>

  <footer class="bottom">
    <div class="card seg" role="group" aria-label="時段">
      <button type="button" data-time="live" class="on"><span class="live-rec"></span>即時 <span class="clock"></span></button>
      <button type="button" data-time="dawn">清晨</button>
      <button type="button" data-time="day">白天</button>
      <button type="button" data-time="dusk">黃昏</button>
      <button type="button" data-time="night">夜晚</button>
    </div>
    <div class="card seg" role="group" aria-label="顯示">
      <button type="button" data-toggle="names" class="on">名牌</button>
      <button type="button" data-toggle="pause">暫停</button>
      <button type="button" id="btn-bird">鳥瞰</button>
      <button type="button" id="btn-music" aria-pressed="true" aria-label="背景音樂（校歌）">♪ 音樂</button>
    </div>
    <button type="button" class="card butler compact" id="butler" aria-label="打開太平G米花的選單">
      <img class="butler-face" id="butler-face" src="./public/qchick/wave.png" alt="" aria-hidden="true">
      <span class="butler-copy">
        <span class="butler-name">太平G米花</span>
        <span class="butler-text" id="butler-text"></span>
      </span>
    </button>
  </footer>

  <section class="card q-dialog" id="q-dialog" aria-label="太平G米花的對話" hidden>
    <button type="button" class="close" id="q-close" aria-label="關閉對話">×</button>
    <div class="q-line" id="q-line">
      <img class="q-face" id="q-face" src="./public/qchick/wave.png" alt="" aria-hidden="true">
      <div>
        <p class="q-name" id="q-name">太平G米花</p>
        <p class="q-text" id="q-text" aria-hidden="true"></p>
        <p class="sr-only" id="q-live" role="status"></p>
      </div>
    </div>
    <div class="q-extra" id="q-extra"></div>
    <div class="q-options" id="q-options"></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
